<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Figure 3. One study as a loop of six steps: question, derive, implement, experiment, break, write. The written note raises the next question." xmlns:c2pa="http://c2pa.org/manifest">
<title>Figure 3. One study as a loop of six steps: question, derive, implement, experiment, break, write. The written note raises the next question.</title>
