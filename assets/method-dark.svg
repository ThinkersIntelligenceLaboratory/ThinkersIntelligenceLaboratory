<text x="40" y="38" font-size="11" class="caps soft">FIG. 3</text><ellipse cx="500" cy="200" rx="250" ry="112" fill="none" stroke="#ece6d8" stroke-width="1.2"/><path transform="translate(375.0 103.0) rotate(-14.5)" d="M-6 -4.5L5 0L-6 4.5z" fill="#ece6d8"/><path transform="translate(625.0 103.0) rotate(14.5)" d="M-6 -4.5L5 0L-6 4.5z" fill="#ece6d8"/><path transform="translate(750.0 200.0) rotate(90.0)" d="M-6 -4.5L5 0L-6 4.5z" fill="#ece6d8"/><path transform="translate(625.0 297.0) rotate(165.5)" d="M-6 -4.5L5 0L-6 4.5z" fill="#ece6d8"/><path transform="translate(375.0 297.0) rotate(-165.5)" d="M-6 -4.5L5 0L-6 4.5z" fill="#ece6d8"/><path transform="translate(250.0 200.0) rotate(-90.0)" d="M-6 -4.5L5 0L-6 4.5z" fill="#ece6d8"/><circle cx="283.5" cy="144.0" r="15" fill="#171613" stroke="#ece6d8" stroke-width="1.4"/><text x="283.5" y="148.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ece6d8">1</text><text x="257.5" y="143.0" font-size="19" class="serif" text-anchor="end" fill="#ece6d8">Question</text><text x="257.5" y="161.0" font-size="12" class="soft" text-anchor="end">a claim that could be false</text><circle cx="500.0" cy="88.0" r="15" fill="#171613" stroke="#ece6d8" stroke-width="1.4"/><text x="500.0" y="92.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ece6d8">2</text><text x="500.0" y="44.0" font-size="19" class="serif" text-anchor="middle" fill="#ece6d8">Derive</text><text x="500.0" y="62.0" font-size="12" class="soft" text-anchor="middle">by hand, assumptions named</text><circle cx="716.5" cy="144.0" r="15" fill="#171613" stroke="#ece6d8" stroke-width="1.4"/><text x="716.5" y="148.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ece6d8">3</text><text x="742.5" y="143.0" font-size="19" class="serif" text-anchor="start" fill="#ece6d8">Implement</text><text x="742.5" y="161.0" font-size="12" class="soft" text-anchor="start">minimal, from scratch</text><circle cx="716.5" cy="256.0" r="15" fill="#171613" stroke="#ece6d8" stroke-width="1.4"/><text x="716.5" y="260.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ece6d8">4</text><text x="742.5" y="255.0" font-size="19" class="serif" text-anchor="start" fill="#ece6d8">Experiment</text><text x="742.5" y="273.0" font-size="12" class="soft" text-anchor="start">seeds, baselines, spread</text><circle cx="500.0" cy="312.0" r="15" fill="#171613" stroke="#ee6f62" stroke-width="1.4"/><text x="500.0" y="316.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ee6f62">5</text><text x="500.0" y="352.0" font-size="19" class="serif" text-anchor="middle" fill="#ee6f62">Break</text><text x="500.0" y="370.0" font-size="12" class="soft" text-anchor="middle">find where it fails</text><circle cx="283.5" cy="256.0" r="15" fill="#171613" stroke="#ece6d8" stroke-width="1.4"/><text x="283.5" y="260.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ece6d8">6</text><text x="257.5" y="255.0" font-size="19" class="serif" text-anchor="end" fill="#ece6d8">Write</text><text x="257.5" y="273.0" font-size="12" class="soft" text-anchor="end">a note worth keeping</text><text x="500" y="196" font-size="16" class="serif it" text-anchor="middle">one study</text><text x="500" y="218" font-size="12.5" class="serif it red" text-anchor="middle">every note ends in a question</text>
