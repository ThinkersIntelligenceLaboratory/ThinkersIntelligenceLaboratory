<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="352" viewBox="0 0 1000 352" role="img" aria-label="Figure 2. (a) The request 'Can you make it shorter?' with its context. (b) Belief over four candidate intents before asking (0.38, 0.34, 0.18, 0.10) and after the answer (0.86, 0.08, 0.04, 0.02). (c) Decision tree: infer if the top belief clears a threshold, otherwise ask if the question is worth its cost, otherwise abstain." xmlns:c2pa="http://c2pa.org/manifest">
<title>Figure 2. (a) The request 'Can you make it shorter?' with its context. (b) Belief over four candidate intents before asking (0.38, 0.34, 0.18, 0.10) and after the answer (0.86, 0.08, 0.04, 0.02). (c) Decision tree: infer if the top belief clears a threshold, otherwise ask if the question is worth its cost, otherwise abstain.</title>
