<style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1d1b17}.serif{font-family:Georgia,'Times New Roman',serif}.it{font-style:italic}.soft{fill:#6f695d}.red{fill:#c2362b}.blue{fill:#27508f}.caps{letter-spacing:2.5px}</style>
<rect x=".5" y=".5" width="999" height="351" rx="6" fill="#f4efe4" stroke="#cfc6b3"/>
<text x="40" y="38" font-size="11" class="caps soft">FIG. 2</text><text x="40" y="76" font-size="15" font-weight="700">a</text><text x="320" y="76" font-size="15" font-weight="700">b</text><text x="680" y="76" font-size="15" font-weight="700">c</text><path d="M296 62V332M656 62V332" stroke="#cfc6b3"/><text x="62" y="76" font-size="11" class="caps soft">REQUEST AND CONTEXT</text><text x="40" y="124" font-size="23" class="serif it">“Can you make it</text><text x="40" y="154" font-size="23" class="serif it">shorter?”</text><text x="40" y="204" font-size="13" class="soft">–  900-word draft</text><text x="40" y="228" font-size="13" class="soft">–  deadline is today</text><text x="40" y="252" font-size="13" class="soft">–  said earlier: “the intro drags”</text><text x="342" y="76" font-size="11" class="caps soft">BELIEF OVER INTENTS</text><text x="320" y="108" font-size="13">cut total length by half</text><rect x="320.5" y="116.5" width="87.4" height="8" fill="#f4efe4" stroke="#1d1b17"/><rect x="320" y="129" width="197.8" height="9" fill="#27508f"/><text x="413.4" y="125" font-size="11" class="soft">0.38</text><text x="523.8" y="138" font-size="11" class="blue">0.86</text><text x="320" y="160" font-size="13">tighten the wording</text><rect x="320.5" y="168.5" width="78.2" height="8" fill="#f4efe4" stroke="#1d1b17"/><rect x="320" y="181" width="18.4" height="9" fill="#27508f"/><text x="404.2" y="177" font-size="11" class="soft">0.34</text><text x="344.4" y="190" font-size="11" class="blue">0.08</text><text x="320" y="212" font-size="13">turn it into bullets</text><rect x="320.5" y="220.5" width="41.4" height="8" fill="#f4efe4" stroke="#1d1b17"/><rect x="320" y="233" width="9.2" height="9" fill="#27508f"/><text x="367.4" y="229" font-size="11" class="soft">0.18</text><text x="335.2" y="242" font-size="11" class="blue">0.04</text><text x="320" y="264" font-size="13">shorten only the intro</text><rect x="320.5" y="272.5" width="23.0" height="8" fill="#f4efe4" stroke="#1d1b17"/><rect x="320" y="285" width="4.6" height="9" fill="#27508f"/><text x="349.0" y="281" font-size="11" class="soft">0.10</text><text x="330.6" y="294" font-size="11" class="blue">0.02</text><rect x="320.5" y="313.5" width="14" height="8" fill="#f4efe4" stroke="#1d1b17"/><text x="342" y="322" font-size="11.5" class="soft">before asking</text><rect x="440" y="313" width="14" height="9" fill="#27508f"/><text x="462" y="322" font-size="11.5" class="soft">after the answer</text><text x="702" y="76" font-size="11" class="caps soft">DECISION</text><rect x="680.5" y="100.5" width="170" height="36" rx="18" fill="#f4efe4" stroke="#1d1b17" stroke-width="1.2"/><text x="765" y="123" font-size="13.5" class="serif it" text-anchor="middle">max P(g | u, c) ≥ τ ?</text><rect x="680.5" y="196.5" width="170" height="36" rx="18" fill="#f4efe4" stroke="#1d1b17" stroke-width="1.2"/><text x="765" y="219" font-size="13.5" class="serif it" text-anchor="middle">EIG(q*) &gt; κ ?</text><path d="M854 118H892" stroke="#1d1b17" stroke-width="1.2" marker-end="url(#arr)"/><text x="872" y="111" font-size="11" class="soft" text-anchor="middle">yes</text><path d="M854 214H892" stroke="#1d1b17" stroke-width="1.2" marker-end="url(#arr)"/><text x="872" y="207" font-size="11" class="soft" text-anchor="middle">yes</text><path d="M765 138V192" stroke="#1d1b17" stroke-width="1.2" marker-end="url(#arr)"/><text x="775" y="169" font-size="11" class="soft">no</text><path d="M765 234V280" stroke="#1d1b17" stroke-width="1.2" marker-end="url(#arr)"/><text x="775" y="261" font-size="11" class="soft">no</text><text x="900" y="122" font-size="13" font-weight="700" letter-spacing="1.5">INFER</text><text x="900" y="140" font-size="12.5" class="serif it red">after</text><text x="900" y="218" font-size="13" font-weight="700" letter-spacing="1.5">ASK</text><text x="900" y="236" font-size="12.5" class="serif it red">before</text><text x="765" y="302" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">ABSTAIN</text><text x="765" y="320" font-size="11.5" class="soft" text-anchor="middle">say “I don’t know”</text>
